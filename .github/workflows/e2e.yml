name: E2E
# Manually triggered only (T29): each run seeds a workflow row against the real, shared dev
# Supabase project (via a dedicated test user -- see tests/e2e/support/seed.ts's safety notes),
# so this does not run on every push/PR the way ci.yml does.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.E2E_TOKEN_ENCRYPTION_KEY }}
          TOKEN_KEY_VERSION: ${{ secrets.E2E_TOKEN_KEY_VERSION }}
          E2E_TEST_USER_ID: ${{ secrets.E2E_TEST_USER_ID }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
